<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Warisan — Estate Distribution Calculator</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@300;400;500&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Noto+Naskh+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #0d0d0d;
  --parchment: #f5f0e8;
  --gold: #b8962e;
  --gold-light: #d4af5a;
  --gold-pale: #f0e4c0;
  --gold-faint: rgba(184,150,46,0.07);
  --jade: #2a5c45;
  --jade-light: #3a7a5e;
  --rust: #8b3a2a;
  --mist: #e8e4dc;
  --line: rgba(184,150,46,0.22);
  --dark: #0f0f0f;
  --dark-card: #1a1a1a;
  --white: #ffffff;
  --arabic-font: 'Noto Naskh Arabic', 'Traditional Arabic', serif;
  --body-font: 'Libre Baskerville', Georgia, serif;
}

*{margin:0;padding:0;box-sizing:border-box;}

body {
  background:var(--parchment);color:var(--ink);
  font-family:var(--body-font);overflow-x:hidden;min-height:100vh;
}
body::before {
  content:'';position:fixed;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events:none;z-index:9999;opacity:0.5;
}

/* ── LANG SWITCHER DROPDOWN ── */
.lang-bar {
  background:var(--dark);border-bottom:1px solid rgba(184,150,46,0.15);
  display:flex;justify-content:flex-end;align-items:center;
  padding:0 3rem;
}
.lang-dropdown { position:relative; }
.lang-trigger {
  display:flex;align-items:center;gap:0.55rem;
  padding:0.55rem 0.9rem;border:none;background:transparent;cursor:pointer;
  font-family:'DM Mono',monospace;font-size:0.62rem;letter-spacing:0.1em;
  text-transform:uppercase;color:var(--gold);transition:color 0.2s;
  border-left:1px solid rgba(184,150,46,0.15);
}
.lang-trigger:hover { color:var(--gold-light); }
.lang-trigger .lang-globe { font-size:0.9rem;opacity:0.6; }
.lang-trigger .lang-label { letter-spacing:0.12em; }
.lang-trigger .lang-caret { font-size:0.5rem;opacity:0.5;transition:transform 0.2s;margin-left:0.1rem; }
.lang-dropdown.open .lang-trigger .lang-caret { transform:rotate(180deg); }
.lang-menu {
  position:absolute;top:calc(100% + 2px);right:0;
  background:var(--dark-card);border:1px solid rgba(184,150,46,0.2);
  min-width:160px;z-index:500;
  opacity:0;pointer-events:none;
  transform:translateY(-6px);
  transition:opacity 0.18s ease,transform 0.18s ease;
  box-shadow:0 8px 24px rgba(0,0,0,0.4);
}
.lang-dropdown.open .lang-menu { opacity:1;pointer-events:auto;transform:translateY(0); }
.lang-option {
  display:flex;align-items:center;gap:0.65rem;
  padding:0.7rem 1rem;cursor:pointer;
  font-family:'DM Mono',monospace;font-size:0.62rem;letter-spacing:0.1em;
  text-transform:uppercase;color:rgba(232,228,220,0.45);
  transition:all 0.15s;border-bottom:1px solid rgba(184,150,46,0.08);
}
.lang-option:last-child { border-bottom:none; }
.lang-option:hover { background:rgba(184,150,46,0.07);color:rgba(232,228,220,0.85); }
.lang-option.active { color:var(--gold);background:rgba(184,150,46,0.05); }
.lang-option .opt-native { font-size:0.85rem;letter-spacing:0;min-width:22px;text-align:center; }
.lang-option[data-lang="ar"] .opt-native { font-family:var(--arabic-font);font-size:1rem; }
.lang-option .opt-check { margin-left:auto;font-size:0.6rem;color:var(--gold);opacity:0; }
.lang-option.active .opt-check { opacity:1; }

/* ── RTL support ── */
html[dir="rtl"] body { font-family: var(--arabic-font); }
html[dir="rtl"] .header-left { text-align:right; }
html[dir="rtl"] .header-right { text-align:left; }
html[dir="rtl"] .lang-menu { right:auto; left:0; }
html[dir="rtl"] .rm-prefix { border-right:none; border-left:1px solid var(--line); }
html[dir="rtl"] .dist-table th:last-child,
html[dir="rtl"] .dist-table td:last-child { text-align:left; }
html[dir="rtl"] .dist-table th:first-child,
html[dir="rtl"] .dist-table td:first-child { text-align:right; }
html[dir="rtl"] .info-box { border-left:none; border-right:3px solid var(--gold-light); }
html[dir="rtl"] .info-box.warn { border-left:none; border-right:3px solid var(--rust); }
html[dir="rtl"] .result-timestamp { text-align:left; }
html[dir="rtl"] .calc-btn::before { transform-origin:right; }
html[dir="rtl"] .section-label { letter-spacing:0.05em; }
html[dir="rtl"] .heir-row-label, html[dir="rtl"] .heir-row-sub,
html[dir="rtl"] .toggle-label, html[dir="rtl"] .toggle-sub { font-family:var(--arabic-font); }
html[dir="rtl"] .dist-heir-name, html[dir="rtl"] .dist-heir-count { font-family:var(--arabic-font); }
html[dir="rtl"] .empty-title { font-family:var(--arabic-font); font-style:normal; }
html[dir="rtl"] .hero-bar p { font-family:var(--arabic-font); font-style:normal; }
html[dir="rtl"] .wordmark .sub { letter-spacing:0; font-family:var(--arabic-font); }
html[dir="rtl"] .header-left, html[dir="rtl"] .header-right { font-family:var(--arabic-font); letter-spacing:0; }
html[dir="rtl"] .hero-bar h2 { font-family:var(--arabic-font); font-style:normal; }
html[dir="rtl"] .result-estate-label { letter-spacing:0; font-family:var(--arabic-font); }
html[dir="rtl"] .estat-lbl { letter-spacing:0; font-family:var(--arabic-font); }
html[dir="rtl"] .dist-section-title { letter-spacing:0; font-family:var(--arabic-font); }
html[dir="rtl"] .info-box p { font-family:var(--arabic-font); }
html[dir="rtl"] .rule-cite { font-family:var(--arabic-font); letter-spacing:0; }
html[dir="rtl"] .heir-tag { letter-spacing:0; font-family:var(--arabic-font); }
html[dir="rtl"] .reset-link { font-family:var(--arabic-font); letter-spacing:0; }
html[dir="rtl"] .input-label { letter-spacing:0; font-family:var(--arabic-font); }

/* ── HEADER ── */
header {
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  padding:1.6rem 3rem;border-bottom:1px solid var(--line);
}
.header-left{font-family:'DM Mono',monospace;font-size:0.6rem;color:var(--gold);letter-spacing:0.15em;text-transform:uppercase;line-height:1.9;}
.wordmark{text-align:center;}
.wordmark h1{font-family:'Playfair Display',serif;font-size:2rem;font-weight:700;letter-spacing:0.08em;color:var(--ink);}
.wordmark .sub{font-family:'DM Mono',monospace;font-size:0.6rem;color:var(--gold);letter-spacing:0.12em;margin-top:0.2rem;text-transform:uppercase;}
.header-right{text-align:right;font-family:'DM Mono',monospace;font-size:0.6rem;color:rgba(13,13,13,0.35);letter-spacing:0.1em;line-height:1.9;}

/* ── HERO BAR ── */
.hero-bar{background:var(--dark);padding:2.5rem 3rem;border-bottom:1px solid rgba(184,150,46,0.15);display:grid;grid-template-columns:1fr 1fr;gap:3rem;align-items:center;}
.hero-bar h2{font-family:'Playfair Display',serif;font-size:2.2rem;color:var(--parchment);font-weight:400;line-height:1.2;}
.hero-bar h2 em{color:var(--gold);font-style:italic;}
html[dir="rtl"] .hero-bar h2 em{font-style:normal;}
.hero-bar p{font-size:0.88rem;color:rgba(232,228,220,0.55);line-height:1.9;font-style:italic;}

/* ── MAIN LAYOUT ── */
.main-wrap{display:grid;grid-template-columns:420px 1fr;min-height:calc(100vh - 200px);}
.left-panel{border-right:1px solid var(--line);padding:2.5rem 2rem;background:var(--parchment);overflow-y:auto;}
html[dir="rtl"] .left-panel{border-right:none;border-left:1px solid var(--line);}

/* Track selector */
.track-selector{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-bottom:2rem;border:1px solid var(--line);}
.track-btn{padding:0.85rem 0.5rem;border:none;background:transparent;cursor:pointer;font-family:'DM Mono',monospace;font-size:0.62rem;letter-spacing:0.12em;text-transform:uppercase;color:rgba(13,13,13,0.4);transition:all 0.2s;display:flex;flex-direction:column;align-items:center;gap:0.3rem;border-right:1px solid var(--line);}
.track-btn:last-child{border-right:none;}
.track-btn .track-icon{font-size:1.1rem;opacity:0.4;transition:opacity 0.2s;}
.track-btn.active.syariah{background:var(--jade);color:#fff;}
.track-btn.active.syariah .track-icon{opacity:1;}
.track-btn.active.civil{background:var(--rust);color:#fff;}
.track-btn.active.civil .track-icon{opacity:1;}
.track-btn:not(.active):hover{background:var(--gold-faint);}
html[dir="rtl"] .track-btn{font-family:var(--arabic-font);letter-spacing:0;font-size:0.78rem;}

/* Section label */
.section-label{font-family:'DM Mono',monospace;font-size:0.58rem;letter-spacing:0.22em;text-transform:uppercase;color:var(--gold);margin-bottom:0.9rem;padding-bottom:0.4rem;border-bottom:1px solid var(--line);}

/* Estate value */
.estate-input-wrap{margin-bottom:1.8rem;}
.input-label{font-family:'DM Mono',monospace;font-size:0.6rem;letter-spacing:0.1em;text-transform:uppercase;color:rgba(13,13,13,0.5);margin-bottom:0.4rem;display:block;}
.rm-input-wrap{display:flex;align-items:center;border:1px solid var(--line);background:var(--white);transition:border-color 0.2s;}
.rm-input-wrap:focus-within{border-color:var(--gold);}
.rm-prefix{padding:0.7rem 0.8rem;font-family:'DM Mono',monospace;font-size:0.75rem;color:var(--gold);background:var(--gold-faint);border-right:1px solid var(--line);letter-spacing:0.05em;white-space:nowrap;}
.rm-input-wrap input{flex:1;padding:0.7rem 0.8rem;border:none;outline:none;background:transparent;font-family:'Libre Baskerville',serif;font-size:1rem;color:var(--ink);width:100%;}
.rm-input-wrap input::placeholder{color:rgba(13,13,13,0.25);}

/* Heir rows */
.heirs-grid{display:flex;flex-direction:column;gap:0.5rem;margin-bottom:1.8rem;}
.heir-row{display:grid;align-items:center;gap:0.6rem;padding:0.65rem 0.8rem;background:var(--white);border:1px solid var(--mist);transition:border-color 0.2s;}
.heir-row.active{border-color:var(--gold-light);}
.heir-row-label{font-size:0.82rem;color:var(--ink);line-height:1.3;}
.heir-row-sub{font-family:'DM Mono',monospace;font-size:0.58rem;color:rgba(13,13,13,0.4);letter-spacing:0.05em;}
.heir-counter{display:flex;align-items:center;gap:0.4rem;justify-content:flex-end;flex-shrink:0;}
.counter-btn{width:26px;height:26px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:0.9rem;color:var(--ink);transition:all 0.15s;display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;}
.counter-btn:hover{background:var(--gold);border-color:var(--gold);color:#fff;}
.counter-val{font-family:'DM Mono',monospace;font-size:0.9rem;font-weight:500;color:var(--ink);min-width:20px;text-align:center;}
.heir-row.syariah-row{grid-template-columns:1fr auto;}
.heir-row.civil-row{grid-template-columns:1fr auto;}

/* Toggle */
.toggle-row{display:flex;justify-content:space-between;align-items:center;padding:0.65rem 0.8rem;background:var(--white);border:1px solid var(--mist);margin-bottom:0.5rem;transition:border-color 0.2s;}
.toggle-row.active{border-color:var(--gold-light);}
.toggle-label{font-size:0.82rem;color:var(--ink);}
.toggle-sub{font-family:'DM Mono',monospace;font-size:0.58rem;color:rgba(13,13,13,0.4);}
.toggle-switch{position:relative;width:40px;height:22px;flex-shrink:0;}
.toggle-switch input{opacity:0;width:0;height:0;}
.toggle-slider{position:absolute;inset:0;background:var(--mist);cursor:pointer;transition:0.2s;border:1px solid var(--line);}
.toggle-slider::before{content:'';position:absolute;width:16px;height:16px;left:2px;top:2px;background:rgba(13,13,13,0.3);transition:0.2s;}
input:checked + .toggle-slider{background:var(--jade);border-color:var(--jade);}
input:checked + .toggle-slider::before{transform:translateX(18px);background:#fff;}

/* Calc btn */
.calc-btn{width:100%;padding:1rem;background:var(--dark);border:none;cursor:pointer;font-family:'DM Mono',monospace;font-size:0.7rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--gold);transition:all 0.2s;margin-top:0.5rem;position:relative;overflow:hidden;}
.calc-btn::before{content:'';position:absolute;inset:0;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform 0.3s ease;}
.calc-btn:hover::before{transform:scaleX(1);}
.calc-btn:hover{color:var(--dark);}
.calc-btn span{position:relative;z-index:1;}
html[dir="rtl"] .calc-btn{font-family:var(--arabic-font);letter-spacing:0;font-size:0.9rem;}

/* Reset */
.reset-link{display:block;text-align:center;margin-top:0.8rem;font-family:'DM Mono',monospace;font-size:0.58rem;letter-spacing:0.1em;text-transform:uppercase;color:rgba(13,13,13,0.3);cursor:pointer;text-decoration:none;transition:color 0.2s;}
.reset-link:hover{color:var(--rust);}

/* RIGHT PANEL */
.right-panel{padding:2.5rem 2.5rem;overflow-y:auto;background:var(--parchment);}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;min-height:500px;text-align:center;gap:1rem;}
.empty-glyph{font-family:'Playfair Display',serif;font-size:5rem;color:rgba(184,150,46,0.15);line-height:1;font-style:italic;}
.empty-title{font-family:'Playfair Display',serif;font-size:1.2rem;color:rgba(13,13,13,0.4);font-style:italic;}
.empty-hint{font-family:'DM Mono',monospace;font-size:0.6rem;letter-spacing:0.1em;color:rgba(13,13,13,0.2);text-transform:uppercase;}

/* Results */
.results-wrap{display:flex;flex-direction:column;gap:2rem;}
.result-header{display:grid;grid-template-columns:1fr auto;align-items:start;gap:1rem;padding-bottom:1.2rem;border-bottom:1px solid var(--line);}
.result-track-badge{display:inline-flex;align-items:center;gap:0.5rem;font-family:'DM Mono',monospace;font-size:0.6rem;letter-spacing:0.12em;text-transform:uppercase;padding:0.3rem 0.7rem;border:1px solid currentColor;}
.result-track-badge.syariah{color:var(--jade);}
.result-track-badge.civil{color:var(--rust);}
html[dir="rtl"] .result-track-badge{font-family:var(--arabic-font);letter-spacing:0;}
.result-estate-val{font-family:'Playfair Display',serif;font-size:2.2rem;font-style:italic;color:var(--gold);margin-top:0.3rem;}
.result-estate-label{font-family:'DM Mono',monospace;font-size:0.58rem;letter-spacing:0.1em;text-transform:uppercase;color:rgba(13,13,13,0.35);margin-top:0.2rem;}
.result-timestamp{font-family:'DM Mono',monospace;font-size:0.58rem;color:rgba(13,13,13,0.25);letter-spacing:0.08em;text-align:right;line-height:1.9;}

.estate-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);}
.estat-cell{background:var(--parchment);padding:1rem 1.2rem;}
.estat-val{font-family:'Playfair Display',serif;font-size:1.4rem;font-style:italic;color:var(--ink);}
.estat-lbl{font-family:'DM Mono',monospace;font-size:0.58rem;letter-spacing:0.1em;text-transform:uppercase;color:rgba(13,13,13,0.35);margin-top:0.2rem;}

.dist-section-title{font-family:'DM Mono',monospace;font-size:0.6rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--gold);margin-bottom:0.8rem;}
.dist-table{width:100%;border-collapse:collapse;}
.dist-table th{font-family:'DM Mono',monospace;font-size:0.58rem;letter-spacing:0.12em;text-transform:uppercase;color:rgba(13,13,13,0.35);padding:0.5rem 0.8rem;text-align:left;border-bottom:1px solid var(--line);font-weight:400;}
.dist-table th:last-child,.dist-table td:last-child{text-align:right;}
.dist-table td{padding:0.85rem 0.8rem;border-bottom:1px solid rgba(184,150,46,0.1);vertical-align:middle;}
.dist-heir-name{font-size:0.9rem;font-weight:700;color:var(--ink);}
.dist-heir-count{font-family:'DM Mono',monospace;font-size:0.65rem;color:rgba(13,13,13,0.4);margin-top:0.1rem;}
.dist-fraction{font-family:'DM Mono',monospace;font-size:0.75rem;color:var(--jade);font-weight:500;}
.dist-fraction.civil-frac{color:var(--rust);}
.dist-pct{font-family:'DM Mono',monospace;font-size:0.68rem;color:rgba(13,13,13,0.4);}
.dist-amount{font-family:'Playfair Display',serif;font-size:1.05rem;font-style:italic;color:var(--ink);}
.dist-per-person{font-family:'DM Mono',monospace;font-size:0.58rem;color:rgba(13,13,13,0.35);margin-top:0.1rem;}
.share-bar-wrap{margin-top:0.2rem;}
.share-bar{height:3px;background:rgba(184,150,46,0.15);position:relative;overflow:hidden;}
.share-bar-fill{height:100%;background:var(--jade);transition:width 0.6s ease;}
.share-bar-fill.civil-bar{background:var(--rust);}

.dist-visual{display:flex;height:28px;overflow:hidden;border:1px solid var(--line);gap:1px;background:var(--line);}
.dist-visual-seg{height:100%;transition:flex 0.6s ease;display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:'DM Mono',monospace;font-size:0.55rem;color:rgba(255,255,255,0.8);letter-spacing:0.05em;min-width:0;}

.residue-row td{background:var(--gold-faint);}
.residue-row .dist-heir-name{color:var(--gold);}
.residue-row .dist-amount{color:var(--gold);}

.info-box{padding:1rem 1.2rem;border-left:3px solid var(--gold-light);background:rgba(184,150,46,0.06);}
.info-box.warn{border-left-color:var(--rust);background:rgba(139,58,42,0.05);}
.info-box p{font-size:0.8rem;line-height:1.7;color:rgba(13,13,13,0.65);}
.info-box strong{color:var(--ink);}
.rule-cite{font-family:'DM Mono',monospace;font-size:0.58rem;letter-spacing:0.08em;color:rgba(13,13,13,0.25);padding-top:0.3rem;}
.heir-tags{display:flex;flex-wrap:wrap;gap:0.4rem;margin-bottom:1.5rem;}
.heir-tag{font-family:'DM Mono',monospace;font-size:0.58rem;letter-spacing:0.08em;text-transform:uppercase;padding:0.22rem 0.55rem;border:1px solid currentColor;}
.heir-tag.syariah-tag{color:var(--jade);}
.heir-tag.civil-tag{color:var(--rust);}

@keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
.results-wrap > *{animation:fadeUp 0.35s ease both;}
.results-wrap > *:nth-child(2){animation-delay:0.05s;}
.results-wrap > *:nth-child(3){animation-delay:0.1s;}
.results-wrap > *:nth-child(4){animation-delay:0.15s;}
.results-wrap > *:nth-child(5){animation-delay:0.2s;}


/* ── ASSET PANEL ── */
.panel-tabs {
  display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line);
  margin-bottom:0;
}
.panel-tab {
  padding:0.7rem 1rem;border:none;background:transparent;cursor:pointer;
  font-family:'DM Mono',monospace;font-size:0.62rem;letter-spacing:0.1em;
  text-transform:uppercase;color:rgba(13,13,13,0.4);transition:all 0.2s;
  border-bottom:2px solid transparent;
}
.panel-tab.active { color:var(--gold);border-bottom-color:var(--gold); }
.panel-tab:hover:not(.active) { color:rgba(13,13,13,0.7); }

/* Asset list */
.asset-list { display:flex;flex-direction:column;gap:0.5rem;margin-bottom:1rem; }
.asset-card {
  background:var(--white);border:1px solid var(--mist);padding:0.7rem 0.8rem;
  position:relative;transition:border-color 0.2s;
}
.asset-card.active-card { border-color:var(--gold-light); }
.asset-card-head {
  display:grid;grid-template-columns:1fr auto;align-items:center;gap:0.5rem;
  margin-bottom:0.4rem;
}
.asset-name-input {
  font-family:'Libre Baskerville',serif;font-size:0.82rem;color:var(--ink);
  border:none;outline:none;background:transparent;width:100%;
  border-bottom:1px solid var(--line);padding-bottom:0.15rem;
}
.asset-name-input:focus { border-bottom-color:var(--gold); }
.asset-del-btn {
  width:20px;height:20px;border:1px solid var(--line);background:transparent;
  cursor:pointer;font-size:0.65rem;color:rgba(13,13,13,0.3);
  display:flex;align-items:center;justify-content:center;transition:all 0.15s;
  flex-shrink:0;
}
.asset-del-btn:hover { background:var(--rust);border-color:var(--rust);color:#fff; }
.asset-row2 {
  display:grid;grid-template-columns:1fr 1fr;gap:0.5rem;margin-top:0.4rem;
}
.asset-field-label {
  font-family:'DM Mono',monospace;font-size:0.55rem;letter-spacing:0.1em;
  text-transform:uppercase;color:rgba(13,13,13,0.38);margin-bottom:0.2rem;
}
.asset-select {

let lang = 'en';

function t(key){ return (T[lang] && T[lang][key]) || T.en[key] || key; }

function toggleLangMenu(e) {
  e.stopPropagation();
  const dd = document.getElementById('lang-dropdown');
  dd.classList.toggle('open');
}

function pickLang(l) {
  // close menu
  document.getElementById('lang-dropdown').classList.remove('open');
  setLang(l);
}

// Close dropdown on outside click
document.addEventListener('click', function() {
  const dd = document.getElementById('lang-dropdown');
  if(dd) dd.classList.remove('open');
});

function setLang(l) {
  lang = l;
  const html = document.documentElement;
  html.setAttribute('lang', l);
  html.setAttribute('dir', l === 'ar' ? 'rtl' : 'ltr');

  // Update dropdown: active option + trigger label
  document.querySelectorAll('.lang-option').forEach(b => {
    b.classList.toggle('active', b.dataset.lang === l);
  });
  const labels = { en: 'English', ms: 'Bahasa', ar: 'عربي' };
  const lbl = document.getElementById('lang-current-label');
  if(lbl) {
    lbl.textContent = labels[l] || 'English';
    lbl.style.fontFamily = l === 'ar' ? 'var(--arabic-font)' : '';
    lbl.style.fontSize   = l === 'ar' ? '0.85rem' : '';
  }

  // Update all data-t elements
  document.querySelectorAll('[data-t]').forEach(el => {
    const key = el.dataset.t;
    el.textContent = t(key);
  });

  // Header left/right (multiline)
  const hl = document.getElementById('h-left');
  if(hl) hl.innerHTML = t('header.left').replace(/\n/g,'<br>');
  const hr = document.getElementById('h-right');
  if(hr) hr.innerHTML = t('header.right').replace(/\n/g,'<br>');

  // Hero title (has em tag)
  const ht = document.getElementById('hero-title');
  if(ht) ht.innerHTML = t('hero.title');

  // Estate input placeholder
  const ev = document.getElementById('estate-val');
  if(ev) ev.placeholder = l==='ar' ? 'مثلاً ٥٠٠٠٠٠' : l==='ms' ? 'cth. 500000' : 'e.g. 500000';

  // Re-render asset list if in that panel
  if(activePanel==='assets') renderAssetList();

  // If results already showing, re-render with new lang
  const rw = document.getElementById('results-wrap');
  if(rw && rw.style.display !== 'none' && lastResult) {
    if(activePanel==='heirs') renderResults(lastEstate, lastResult);
  }
}

let track = 'syariah';
let lastResult = null;
let lastEstate = 0;

const counts = {
  's-husband':0,'s-wives':0,'s-sons':0,'s-daughters':0,
  's-gsons':0,'s-gdaughters':0,'s-father':0,'s-mother':0,
  's-fbro':0,'s-fsis':0,'s-pbro':0,'s-psis':0,'s-msib':0,
  's-pgf':0,'s-mgm':0,
  'c-spouse':0,'c-children':0,'c-grandchildren':0,'c-parents':0,
  'c-siblings':0,'c-nepniece':0,'c-grandparents':0,'c-uncleaunt':0,
};

function g(id){ return document.getElementById(id); }
function cv(key){ return counts[key]||0; }
function isMale(){ return g('s-male').checked; }

function adj(key, delta){
  const maxMap={'s-husband':1,'s-father':1,'s-mother':1,'s-pgf':1,'s-mgm':1,'s-wives':4,'c-spouse':1,'c-parents':2};
  const max = maxMap[key]!==undefined ? maxMap[key] : 20;
  counts[key] = Math.max(0, Math.min(max, (counts[key]||0)+delta));
  const el = g('val-'+key);
  if(el) el.textContent = counts[key];
  const row = el && el.closest('.heir-row');
  if(row) row.classList.toggle('active', counts[key]>0);
}

function setTrack(tr){
  track = tr;
  g('btn-syariah').classList.toggle('active', tr==='syariah');
  g('btn-civil').classList.toggle('active', tr==='civil');
  g('syariah-inputs').style.display = tr==='syariah' ? '' : 'none';
  g('civil-inputs').style.display = tr==='civil' ? '' : 'none';
  g('empty-state').style.display='flex';
  g('results-wrap').style.display='none';
  lastResult=null;
  assets=[];
  assetIdCounter=0;
  const al=g('asset-list');
  if(al) al.innerHTML='';
  const lv=g('liabilities-val');
  if(lv) lv.value='';
}

function resetAll(){
  Object.keys(counts).forEach(k=>{ counts[k]=0; const el=g('val-'+k); if(el) el.textContent=0; });
  document.querySelectorAll('.heir-row').forEach(r=>r.classList.remove('active'));
  g('estate-val').value='';
  g('s-male').checked=true;
  g('empty-state').style.display='flex';
  g('results-wrap').style.display='none';
  lastResult=null;
}

function fmt(n){ return 'RM '+n.toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtShort(n){ if(n>=1e6) return 'RM '+(n/1e6).toFixed(2)+'M'; if(n>=1e3) return 'RM '+(n/1e3).toFixed(1)+'K'; return fmt(n); }
function fmtFrac(a,b){ if(b===0)return ''; const g2=gcd(a,b); return (a/g2)+'/'+(b/g2); }
function gcd(a,b){ return b===0?a:gcd(b,a%b); }
function pct(s){ return (s*100).toFixed(2)+'%'; }

// ═══════════════════════════════════════════
// FARAID ENGINE
// ═══════════════════════════════════════════
function calcFaraid(estate){
  const male=isMale();
  const h={ husband:cv('s-husband'),wives:cv('s-wives'),sons:cv('s-sons'),daughters:cv('s-daughters'),gsons:cv('s-gsons'),gdaughters:cv('s-gdaughters'),father:cv('s-father'),mother:cv('s-mother'),fbro:cv('s-fbro'),fsis:cv('s-fsis'),pbro:cv('s-pbro'),psis:cv('s-psis'),msib:cv('s-msib'),pgf:cv('s-pgf'),mgm:cv('s-mgm') };
  const hasDirectSon=h.sons>0, hasDirectDaughter=h.daughters>0, hasDirectChild=hasDirectSon||hasDirectDaughter;
  const gsonsActive=!hasDirectSon?h.gsons:0, gdaughtersActive=!hasDirectSon?h.gdaughters:0;
  const hasDescendantEff=hasDirectChild||gsonsActive>0||gdaughtersActive>0;
  const pgfActive=(h.father===0)?h.pgf:0, mgmActive=(h.mother===0)?h.mgm:0;
  const fatherOrGf=(h.father>0||pgfActive>0);
  const siblingsBlocked=fatherOrGf||hasDirectSon||gsonsActive>0;
  const fbroActive=siblingsBlocked?0:h.fbro, fsisActive=siblingsBlocked?0:h.fsis;
  const pbroActive=(siblingsBlocked||fbroActive>0)?0:h.pbro, psisActive=(siblingsBlocked||fbroActive>0||fsisActive>0)?0:h.psis;
  const msibActive=(fatherOrGf||hasDescendantEff)?0:h.msib;
  const husbandActive=(!male)?h.husband:0, wivesActive=male?h.wives:0;

  let alloc=[];
  if(husbandActive>0) alloc.push({label:t('heir.husband').replace(/ \(زوج\)/,''),key:'husband',count:husbandActive,frac:hasDescendantEff?[1,4]:[1,2],type:'fixed',rule:hasDescendantEff?'1/4':'1/2'});
  if(wivesActive>0)   alloc.push({label:t('heir.wives').replace(/ \(.*\)/,''),key:'wives',count:wivesActive,frac:hasDescendantEff?[1,8]:[1,4],type:'fixed',shared:true,rule:hasDescendantEff?'1/8':'1/4'});
  if(h.father>0)      alloc.push({label:t('heir.father').replace(/ \(.*\)/,''),key:'father',count:1,frac:[1,6],type:hasDescendantEff?'fixed':'fixed+residue',rule:hasDescendantEff?'1/6':'1/6 + residue'});
  if(h.mother>0)      alloc.push({label:t('heir.mother').replace(/ \(.*\)/,''),key:'mother',count:1,frac:(hasDescendantEff||(h.fbro+h.fsis+h.pbro+h.psis+h.msib)>=2)?[1,6]:[1,3],type:'fixed',rule:hasDescendantEff?'1/6':'1/3'});
  if(pgfActive>0&&h.father===0) alloc.push({label:t('heir.pgf').replace(/ \(.*\)/,''),key:'pgf',count:1,frac:[1,6],type:hasDescendantEff?'fixed':'fixed+residue',rule:hasDescendantEff?'1/6':'1/6 + residue'});
  if(mgmActive>0)     alloc.push({label:t('heir.mgm').replace(/ \(.*\)/,''),key:'mgm',count:1,frac:[1,6],type:'fixed',rule:'1/6'});
  if(hasDirectDaughter&&!hasDirectSon) alloc.push({label:h.daughters===1?t('heir.daughters').replace(/ \(.*\)/,''):t('heir.daughters').replace(/ \(.*\)/,''),key:'daughters',count:h.daughters,frac:h.daughters===1?[1,2]:[2,3],type:'fixed',shared:h.daughters>1,rule:h.daughters===1?'1/2':'2/3'});
  if(gdaughtersActive>0&&gsonsActive===0&&!hasDirectChild) alloc.push({label:t('heir.gdaughters').replace(/ \(.*\)/,''),key:'gdaughters',count:gdaughtersActive,frac:gdaughtersActive===1?[1,2]:[2,3],type:'fixed',shared:gdaughtersActive>1,rule:gdaughtersActive===1?'1/2':'2/3'});
  if(msibActive>0)    alloc.push({label:t('heir.msib').replace(/ \(.*\)/,''),key:'msib',count:msibActive,frac:msibActive===1?[1,6]:[1,3],type:'fixed',shared:msibActive>1,rule:msibActive===1?'1/6':'1/3'});
  if(fsisActive>0&&fbroActive===0&&!hasDescendantEff) alloc.push({label:t('heir.fsis').replace(/ \(.*\)/,''),key:'fsis',count:fsisActive,frac:fsisActive===1?[1,2]:[2,3],type:'fixed',shared:fsisActive>1,rule:fsisActive===1?'1/2':'2/3'});
  if(psisActive>0&&pbroActive===0&&!hasDescendantEff&&h.father===0&&fbroActive===0&&fsisActive===0) alloc.push({label:t('heir.psis').replace(/ \(.*\)/,''),key:'psis',count:psisActive,frac:psisActive===1?[1,2]:[2,3],type:'fixed',shared:psisActive>1,rule:psisActive===1?'1/2':'2/3'});

  let fixedSum=0;
  alloc.forEach(a=>{if(a.type==='fixed'||a.type==='fixed+residue') fixedSum+=a.frac[0]/a.frac[1];});
  const residuaryAmount=Math.max(0,1-fixedSum);

  let residuaryHeirs=[];
  if(hasDirectSon||hasDirectChild){
    residuaryHeirs.push({label:hasDirectDaughter&&hasDirectSon?'sons_daughters':(h.sons>1?t('heir.sons').replace(/ \(.*\)/,''):t('heir.sons').replace(/ \(.*\)/,'')),key:'sons',sons:h.sons,daughters:hasDirectSon?h.daughters:0,type:'asaba_children'});
  } else if(gsonsActive>0||gdaughtersActive>0){
    residuaryHeirs.push({key:'gsons',sons:gsonsActive,daughters:gdaughtersActive,type:'asaba_children'});
  }
  const fatherItem=alloc.find(a=>a.key==='father'), pgfItem=alloc.find(a=>a.key==='pgf');
  if(fatherItem&&fatherItem.type==='fixed+residue') residuaryHeirs.push({label:t('heir.father').replace(/ \(.*\)/,''),key:'father_res',count:1,type:'asaba_simple'});
  else if(pgfItem&&pgfItem.type==='fixed+residue') residuaryHeirs.push({label:t('heir.pgf').replace(/ \(.*\)/,''),key:'pgf_res',count:1,type:'asaba_simple'});
  else if(fbroActive>0||fsisActive>0) residuaryHeirs.push({key:'fbro',bros:fbroActive,sis:fsisActive,type:'asaba_sibling'});
  else if(pbroActive>0||psisActive>0) residuaryHeirs.push({key:'pbro',bros:pbroActive,sis:psisActive,type:'asaba_sibling'});

  const hasAsaba=residuaryHeirs.length>0;
  let rows=[],warnings=[],blocked=[];

  alloc.forEach(a=>{
    if(a.type==='fixed'||a.type==='fixed+residue'){
      const sv=a.frac[0]/a.frac[1];
      rows.push({label:a.label,count:a.count,fracStr:fmtFrac(a.frac[0],a.frac[1]),pctStr:pct(sv),totalAmount:estate*sv,perPerson:a.shared?estate*sv/a.count:estate*sv,rule:a.rule,color:'jade',shareVal:sv});
    }
  });

  if(hasAsaba&&residuaryAmount>0){
    residuaryHeirs.forEach(rh=>{
      if(rh.type==='asaba_children'){
        const units=rh.sons*2+(rh.daughters||0);
        const uv=units>0?residuaryAmount/units:0;
        if(rh.sons>0) rows.push({label:rh.sons===1?t('heir.sons').replace(/ \(.*\)/,''):t('heir.sons').replace(/ \(.*\)/,''),count:rh.sons,fracStr:'('+t('result.share')+')',pctStr:pct(uv*rh.sons*2),totalAmount:estate*uv*rh.sons*2,perPerson:estate*uv*2,rule:'Asaba — 2x',color:'jade',shareVal:uv*rh.sons*2,isResiduary:true});
        if(rh.daughters>0&&rh.sons>0) rows.push({label:t('heir.daughters').replace(/ \(.*\)/,''),count:rh.daughters,fracStr:'('+t('result.share')+')',pctStr:pct(uv*rh.daughters),totalAmount:estate*uv*rh.daughters,perPerson:estate*uv,rule:'Asaba — 1x',color:'jade',shareVal:uv*rh.daughters,isResiduary:true});
      } else if(rh.type==='asaba_simple'){
        rows.push({label:rh.label,count:rh.count||1,fracStr:'('+t('result.share')+')',pctStr:pct(residuaryAmount),totalAmount:estate*residuaryAmount,perPerson:estate*residuaryAmount/(rh.count||1),rule:'Asaba',color:'jade',shareVal:residuaryAmount,isResiduary:true});
      } else if(rh.type==='asaba_sibling'){
        const units=rh.bros*2+rh.sis,uv=units>0?residuaryAmount/units:0;
        if(rh.bros>0) rows.push({label:t('heir.fbro').replace(/ \(.*\)/,''),count:rh.bros,fracStr:'(Asaba)',pctStr:pct(uv*rh.bros*2),totalAmount:estate*uv*rh.bros*2,perPerson:estate*uv*2,rule:'Asaba 2x',color:'jade',shareVal:uv*rh.bros*2,isResiduary:true});
        if(rh.sis>0) rows.push({label:t('heir.fsis').replace(/ \(.*\)/,''),count:rh.sis,fracStr:'(Asaba)',pctStr:pct(uv*rh.sis),totalAmount:estate*uv*rh.sis,perPerson:estate*uv,rule:'Asaba 1x',color:'jade',shareVal:uv*rh.sis,isResiduary:true});
      }
    });
  } else if(!hasAsaba&&residuaryAmount>0.001){
    rows.push({label:t('bayt.label'),count:1,fracStr:fmtFrac(Math.round(residuaryAmount*100),100),pctStr:pct(residuaryAmount),totalAmount:estate*residuaryAmount,perPerson:estate*residuaryAmount,rule:t('bayt.rule'),color:'gold',shareVal:residuaryAmount,isBayt:true});
    warnings.push(t('warn.bayt'));
  }

  if(rows.length===0) warnings.push(t('warn.noheirs'));
  const ts=rows.reduce((s,r)=>s+r.shareVal,0);
  if(Math.abs(ts-1)>0.01&&rows.length>0) warnings.push(t('warn.shares'));

  if(h.gsons>0&&gsonsActive===0) blocked.push(t('heir.gsons').replace(/ \(.*\)/,''));
  if(h.gdaughters>0&&gdaughtersActive===0) blocked.push(t('heir.gdaughters').replace(/ \(.*\)/,''));
  if(h.pgf>0&&pgfActive===0) blocked.push(t('heir.pgf').replace(/ \(.*\)/,''));
  if(h.mgm>0&&mgmActive===0) blocked.push(t('heir.mgm').replace(/ \(.*\)/,''));
  if((h.fbro>0&&fbroActive===0)||(h.fsis>0&&fsisActive===0)) blocked.push(t('heir.fbro').replace(/ \(.*\)/,'')+' / '+t('heir.fsis').replace(/ \(.*\)/,''));
  if((h.pbro>0&&pbroActive===0)||(h.psis>0&&psisActive===0)) blocked.push(t('heir.pbro').replace(/ \(.*\)/,''));
  if(h.msib>0&&msibActive===0) blocked.push(t('heir.msib').replace(/ \(.*\)/,''));

  return{rows,warnings,blocked,track:'syariah',totalShares:ts};
}

// CIVIL ENGINE
// ═══════════════════════════════════════════
function calcCivil(estate){
  const h={spouse:cv('c-spouse'),children:cv('c-children'),grandchildren:cv('c-grandchildren'),parents:cv('c-parents'),siblings:cv('c-siblings'),nepniece:cv('c-nepniece'),grandparents:cv('c-grandparents'),uncleaunt:cv('c-uncleaunt')};
  const ec=h.children+h.grandchildren, hasC=ec>0;
  let rows=[],warnings=[],blocked=[];

  if(h.spouse>0&&hasC){
    rows.push({label:t('heir.c.spouse'),count:1,fracStr:'1/4',pctStr:pct(1/4),totalAmount:estate/4,perPerson:estate/4,rule:'1/4',color:'rust',shareVal:1/4});
    rows.push({label:t('heir.c.children'),count:ec,fracStr:'3/4',pctStr:pct(3/4/ec),totalAmount:estate*3/4,perPerson:estate*3/4/ec,rule:'3/4',color:'rust',shareVal:3/4});
  } else if(h.spouse>0&&!hasC&&h.parents>0){
    rows.push({label:t('heir.c.spouse'),count:1,fracStr:'1/2',pctStr:pct(1/2),totalAmount:estate/2,perPerson:estate/2,rule:'1/2',color:'rust',shareVal:1/2});
    rows.push({label:t('heir.c.parents'),count:h.parents,fracStr:'1/2',pctStr:pct(1/2/h.parents),totalAmount:estate/2,perPerson:estate/2/h.parents,rule:'1/2',color:'rust',shareVal:1/2});
  } else if(h.spouse>0&&!hasC&&h.parents===0&&(h.siblings>0||h.nepniece>0)){
    const st=h.siblings+h.nepniece;
    rows.push({label:t('heir.c.spouse'),count:1,fracStr:'1/2',pctStr:pct(1/2),totalAmount:estate/2,perPerson:estate/2,rule:'1/2',color:'rust',shareVal:1/2});
    rows.push({label:t('heir.c.siblings'),count:st,fracStr:'1/2',pctStr:pct(1/2/st),totalAmount:estate/2,perPerson:estate/2/st,rule:'1/2',color:'rust',shareVal:1/2});
  } else if(h.spouse>0&&!hasC&&h.parents===0&&h.siblings===0&&h.nepniece===0){
    rows.push({label:t('heir.c.spouse'),count:1,fracStr:'Full',pctStr:'100%',totalAmount:estate,perPerson:estate,rule:'Full',color:'rust',shareVal:1});
  } else if(!h.spouse&&hasC){
    rows.push({label:t('heir.c.children'),count:ec,fracStr:'Full',pctStr:pct(1/ec),totalAmount:estate,perPerson:estate/ec,rule:'Full',color:'rust',shareVal:1});
  } else if(!h.spouse&&!hasC&&h.parents>0){
    rows.push({label:t('heir.c.parents'),count:h.parents,fracStr:'Full',pctStr:pct(1/h.parents),totalAmount:estate,perPerson:estate/h.parents,rule:'Full',color:'rust',shareVal:1});
    if(h.siblings>0) blocked.push(t('heir.c.siblings'));
  } else if(!h.spouse&&!hasC&&h.parents===0&&(h.siblings>0||h.nepniece>0)){
    const st=h.siblings+h.nepniece;
    rows.push({label:t('heir.c.siblings'),count:st,fracStr:'Full',pctStr:pct(1/st),totalAmount:estate,perPerson:estate/st,rule:'Full',color:'rust',shareVal:1});
  } else if(!h.spouse&&!hasC&&h.parents===0&&h.siblings===0&&h.nepniece===0&&h.grandparents>0){
    rows.push({label:t('heir.c.grandparents'),count:h.grandparents,fracStr:'Full',pctStr:pct(1/h.grandparents),totalAmount:estate,perPerson:estate/h.grandparents,rule:'Full',color:'rust',shareVal:1});
  } else if(h.uncleaunt>0){
    rows.push({label:t('heir.c.uncleaunt'),count:h.uncleaunt,fracStr:'Full',pctStr:pct(1/h.uncleaunt),totalAmount:estate,perPerson:estate/h.uncleaunt,rule:'Full',color:'rust',shareVal:1});
  } else {
    warnings.push(t('warn.bona'));
  }
  if(h.grandchildren>0) warnings.push(t('warn.grandchildren'));
  if(h.nepniece>0) warnings.push(t('warn.nepniece'));
  return{rows,warnings,blocked,track:'civil',totalShares:rows.reduce((s,r)=>s+r.shareVal,0)};
}

// RENDER
// ═══════════════════════════════════════════
function calculate(){
  if(activePanel==='assets'){ calculateAssets(); return; }
  const ev=parseFloat(g('estate-val').value);
  if(!ev||ev<=0){ alert(lang==='ar'?'يُرجى إدخال قيمة صحيحة للتركة أكبر من صفر.':lang==='ms'?'Sila masukkan nilai harta pusaka yang sah melebihi 0.':'Please enter a valid estate value greater than 0.'); return; }
  lastEstate=ev;
  lastResult=track==='syariah'?calcFaraid(ev):calcCivil(ev);
  renderResults(ev,lastResult);
}

function renderResults(estate,result){
  g('empty-state').style.display='none';
  const wrap=g('results-wrap');
  wrap.style.display='flex';
  wrap.innerHTML='';

  const now=new Date();
  const dateStr=now.toLocaleDateString(lang==='ar'?'ar-MA':lang==='ms'?'ms-MY':'en-MY',{day:'2-digit',month:'short',year:'numeric'});
  const timeStr=now.toLocaleTimeString('en-MY',{hour:'2-digit',minute:'2-digit'});
  const trackBadge=result.track==='syariah'?t('result.syariah.badge'):t('result.civil.badge');
  const trackColor=result.track==='syariah'?'jade':'rust';
  const totalHeirs=result.rows.reduce((s,r)=>s+(r.count||1),0);

  const segColors=result.track==='syariah'
    ?['2a5c45','3a7a5e','4a9a6e','5aaa7e','1a4c35','6aba8e','0a3c25','7aca9e']
    :['8b3a2a','a84a38','c05a46','7a2a1a','d06a56','6a1a0a','b05040','903020'];
  const segments=result.rows.map((r,i)=>
    `<div class="dist-visual-seg" style="flex:${Math.round(r.shareVal*1000)};background:#${segColors[i%segColors.length]};" title="${r.label}: ${r.pctStr}">${r.shareVal>0.1?r.label.split(' ')[0]:''}</div>`
  ).join('');

  const tableRows=result.rows.map(r=>`
    <tr class="${r.isBayt?'residue-row':''}">
      <td>
        <div class="dist-heir-name">${r.label}</div>
        <div class="dist-heir-count">${r.count>1?r.count+' '+t('result.persons.each'):'1 '+t('result.person.each')}</div>
      </td>
      <td>
        <div class="dist-fraction ${result.track==='civil'?'civil-frac':''}">${r.fracStr}</div>
        <div class="dist-pct">${r.pctStr}</div>
        <div class="share-bar-wrap"><div class="share-bar" style="width:80px;"><div class="share-bar-fill ${result.track==='civil'?'civil-bar':''}" style="width:${Math.min(100,r.shareVal*100)}%;"></div></div></div>
      </td>
      <td><div style="font-family:'DM Mono',monospace;font-size:0.65rem;color:rgba(13,13,13,0.4);margin-bottom:0.1rem;">${r.rule}</div></td>
      <td>
        <div class="dist-amount">${fmt(r.totalAmount)}</div>
        ${r.count>1?`<div class="dist-per-person">${fmt(r.perPerson)} ${t('result.each')}</div>`:''}
      </td>
    </tr>`).join('');

  const blockedHTML=result.blocked&&result.blocked.length>0?`
    <div class="info-box">
      <p><strong>${t('blocked.title')}</strong> ${t('blocked.note')} <em>${result.blocked.join('; ')}</em>.</p>
      <div class="rule-cite">${t('blocked.rule')}</div>
    </div>`:'';

  const warningsHTML=result.warnings.map(w=>`<div class="info-box warn"><p>${w}</p></div>`).join('');

  const tags=result.rows.map(r=>`<span class="heir-tag ${result.track==='syariah'?'syariah-tag':'civil-tag'}">${r.label}${r.count>1?' ×'+r.count:''}</span>`).join('');

  wrap.innerHTML=`
    <div class="result-header">
      <div>
        <span class="result-track-badge ${trackColor}">${trackBadge}</span>
        <div class="result-estate-val">${fmtShort(estate)}</div>
        <div class="result-estate-label">${t('result.net')}</div>
      </div>
      <div class="result-timestamp">
        ${t('result.calculated')} ${dateStr}<br>${t('result.at')} ${timeStr}<br>
        <span style="color:var(--gold);font-size:0.55rem;">${t('result.indicative')}</span>
      </div>
    </div>
    <div class="estate-stats">
      <div class="estat-cell"><div class="estat-val">${result.rows.length}</div><div class="estat-lbl">${t('result.categories')}</div></div>
      <div class="estat-cell"><div class="estat-val">${totalHeirs}</div><div class="estat-lbl">${t('result.persons')}</div></div>
      <div class="estat-cell"><div class="estat-val">${pct(result.totalShares)}</div><div class="estat-lbl">${t('result.allocated')}</div></div>
    </div>
    ${tags?`<div class="heir-tags">${tags}</div>`:''}
    <div class="dist-visual">${segments}</div>
    <div>
      <div class="dist-section-title">${t('result.breakdown')}</div>
      <table class="dist-table">
        <thead><tr><th>${t('result.heir')}</th><th>${t('result.share')}</th><th>${t('result.basis')}</th><th>${t('result.amount')}</th></tr></thead>
        <tbody>${tableRows}</tbody>
      </table>
    </div>
    ${blockedHTML}
    ${warningsHTML}
    <div class="info-box">
      <p><strong>${t('disclaimer.title')}</strong> ${t('disclaimer.text')}</p>
      <div class="rule-cite">${result.track==='syariah'?t('disclaimer.rule.syariah'):t('disclaimer.rule.civil')}</div>
    </div>`;
}

// ═══════════════════════════════════════════
// ASSET LEDGER ENGINE
// ═══════════════════════════════════════════
let assets = [];
let assetIdCounter = 0;
let activePanel = 'heirs';

const ASSET_TYPES = ['cash','property','vehicle','shares','business','other'];
const MODES = ['A','B','C'];
const DISCOUNT_MAP = {
  A: { 0:0, 1:0.10, 2:0.20, 3:0.40 },
  B: { 0:0, 1:0.05, 2:0.12, 3:0.20 },
  C: { 0:0.05, 1:0.10, 2:0.15, 3:0.20 },
};
const URGENCY_LABELS = {
  en: ['Voluntary (6–12 mo)','Court Order (3–6 mo)','Forced (< 3 mo)','Distress Sale'],
  ms: ['Sukarela (6–12 bln)','Perintah Mahkamah','Paksaan (< 3 bln)','Jualan Tertekan'],
  ar: ['طوعي (٦–١٢ شهراً)','أمر المحكمة','إجباري (< ٣ أشهر)','بيع متعثر'],
};
const ASSET_TYPE_LABELS = {
  en: {cash:'Cash / Bank',property:'Property',vehicle:'Vehicle',shares:'Shares / Securities',business:'Business Interest',other:'Other'},
  ms: {cash:'Tunai / Bank',property:'Hartanah',vehicle:'Kenderaan',shares:'Saham / Sekuriti',business:'Kepentingan Perniagaan',other:'Lain-lain'},
  ar: {cash:'نقد / بنك',property:'عقار',vehicle:'مركبة',shares:'أسهم / أوراق مالية',business:'حصة تجارية',other:'أخرى'},
};
const MODE_LABELS = {
  en: {A:'Collective Sale',B:'Buyout',C:'Co-ownership (Musyaʿ)'},
  ms: {A:'Jualan Bersama',B:'Buyout',C:'Milik Bersama (Musyaʿ)'},
  ar: {A:'بيع جماعي',B:'افتداء',C:'مشاع'},
};

function switchPanel(p) {
  activePanel = p;
  const tabH = g('tab-heirs'), tabA = g('tab-assets');
  if(tabH) tabH.classList.toggle('active', p==='heirs');
  if(tabA) tabA.classList.toggle('active', p==='assets');

  const trackSel = document.querySelector('.track-selector');
  const syariahDiv = g('syariah-inputs');
  const civilDiv = g('civil-inputs');
  const estateDiv = g('main-estate-wrap');
  const assetPnl = g('asset-panel');
  // also hide the static section-label for estate if present
  const estateLbl = estateDiv && estateDiv.previousElementSibling;

  if(p === 'heirs') {
    if(trackSel) trackSel.style.display = '';
    if(estateDiv) estateDiv.style.display = '';
    if(estateLbl && estateLbl.classList.contains('section-label')) estateLbl.style.display = '';
    if(syariahDiv) syariahDiv.style.display = track === 'syariah' ? '' : 'none';
    if(civilDiv)   civilDiv.style.display   = track === 'civil'   ? '' : 'none';
    if(assetPnl)   assetPnl.style.display   = 'none';
  } else {
    if(trackSel) trackSel.style.display = 'none';
    if(estateDiv) estateDiv.style.display = 'none';
    if(estateLbl && estateLbl.classList.contains('section-label')) estateLbl.style.display = 'none';
    if(syariahDiv) syariahDiv.style.display = 'none';
    if(civilDiv)   civilDiv.style.display   = 'none';
    if(assetPnl)   assetPnl.style.display   = '';
    renderAssetList();
  }
  g('empty-state').style.display = 'flex';
  g('results-wrap').style.display = 'none';
  lastResult = null;
}

function addAsset() {
  const id = ++assetIdCounter;
  assets.push({ id, name: 'Asset ' + id, type: 'property', appraised: 0, mode: 'A', urgency: 0 });
  renderAssetList();
}

function removeAsset(id) {
  assets = assets.filter(function(a){ return a.id !== id; });
  renderAssetList();
}

function updateAsset(id, field, val) {
  const a = assets.find(function(x){ return x.id === id; });
  if(!a) return;
  a[field] = (field === 'appraised' || field === 'urgency') ? (parseFloat(val) || 0) : val;
  if(field === 'mode' || field === 'type') {
    renderAssetList();
  } else {
    const card = document.querySelector('.asset-card[data-id="' + id + '"]');
    if(card) card.classList.toggle('active-card', a.appraised > 0);
  }
}

function renderAssetList() {
  const list = g('asset-list');
  if(!list) return;
  if(assets.length === 0) {
    list.innerHTML = '<div style="padding:0.8rem;text-align:center;font-family:\'DM Mono\',monospace;font-size:0.6rem;color:rgba(13,13,13,0.25);">' +
      (lang === 'ar' ? 'لا توجد أصول مضافة' : lang === 'ms' ? 'Tiada aset ditambah' : 'No assets added — click + Add Asset below') +
      '</div>';
    return;
  }
  const tl = ASSET_TYPE_LABELS[lang] || ASSET_TYPE_LABELS.en;
  const ml = MODE_LABELS[lang] || MODE_LABELS.en;
  const ul = URGENCY_LABELS[lang] || URGENCY_LABELS.en;

  var html = '';
  for(var i = 0; i < assets.length; i++) {
    var a = assets[i];
    var showUrgency = (a.mode === 'A');
    var disc = (DISCOUNT_MAP[a.mode] && DISCOUNT_MAP[a.mode][a.urgency]) || 0;
    var adjVal = a.appraised * (1 - disc);

    var typeOptions = '';
    for(var ti = 0; ti < ASSET_TYPES.length; ti++) {
      var tv = ASSET_TYPES[ti];
      typeOptions += '<option value="' + tv + '"' + (a.type === tv ? ' selected' : '') + '>' + (tl[tv] || tv) + '</option>';
    }

    var modeBtns = '';
    for(var mi = 0; mi < MODES.length; mi++) {
      var mv = MODES[mi];
      modeBtns += '<button class="mode-btn mode-' + mv + (a.mode === mv ? ' sel' : '') + '" onclick="updateAsset(' + a.id + ',\'mode\',\'' + mv + '\')">' + mv + ': ' + (ml[mv] || mv) + '</button>';
    }

    var adjLine = '';
    if(a.appraised > 0) {
      adjLine = '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:0.5rem;padding-top:0.4rem;border-top:1px solid var(--line);">' +
        '<span style="font-family:\'DM Mono\',monospace;font-size:0.58rem;color:rgba(13,13,13,0.35);">' + (lang === 'ar' ? 'القيمة المعدّلة' : lang === 'ms' ? 'Nilai Terlaras' : 'Adjusted Value') + '</span>' +
        '<span class="adj-val">' + fmt(adjVal) + '</span></div>';
    }

    html += '<div class="asset-card' + (a.appraised > 0 ? ' active-card' : '') + '" data-id="' + a.id + '">' +
      '<div class="asset-card-head">' +
      '<input class="asset-name-input" value="' + a.name.replace(/"/g,'&quot;') + '" oninput="updateAsset(' + a.id + ',\'name\',this.value)" placeholder="' + (lang==='ar'?'اسم الأصل':lang==='ms'?'Nama aset':'Asset name') + '">' +
      '<button class="asset-del-btn" onclick="removeAsset(' + a.id + ')" title="Remove">✕</button>' +
      '</div>' +
      '<div class="asset-row2">' +
      '<div><div class="asset-field-label">' + (lang==='ar'?'النوع':lang==='ms'?'Jenis':'Type') + '</div>' +
      '<select class="asset-select" onchange="updateAsset(' + a.id + ',\'type\',this.value)">' + typeOptions + '</select></div>' +
      '<div><div class="asset-field-label">' + (lang==='ar'?'القيمة المقدّرة':lang==='ms'?'Nilai Taksiran':'Appraised Value') + '</div>' +
      '<div class="rm-input-wrap" style="border:1px solid var(--line);"><span class="rm-prefix">RM</span>' +
      '<input type="number" class="asset-val-input" value="' + (a.appraised || '') + '" min="0" step="1000" oninput="updateAsset(' + a.id + ',\'appraised\',this.value)" placeholder="0"></div></div>' +
      '</div>' +
      '<div class="asset-row3">' +
      '<div class="asset-field-label" style="margin-bottom:0.3rem;">' + (lang==='ar'?'وضع الحل':lang==='ms'?'Mod Penyelesaian':'Resolution Mode') + '</div>' +
      '<div class="mode-btns">' + modeBtns + '</div>' +
      '</div>' +
      '<div class="asset-urgency-row' + (showUrgency ? ' show' : '') + '">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;">' +
      '<div class="asset-field-label">' + (lang==='ar'?'الاستعجال':lang==='ms'?'Keterdesakan':'Sale Urgency') + '</div>' +
      '<span class="discount-note">−' + (disc*100).toFixed(0) + '% discount</span>' +
      '</div>' +
      '<input type="range" class="urgency-slider" min="0" max="3" step="1" value="' + a.urgency + '" oninput="updateAsset(' + a.id + ',\'urgency\',this.value)">' +
      '<div style="font-family:\'DM Mono\',monospace;font-size:0.58rem;color:rgba(13,13,13,0.4);">' + (ul[a.urgency] || '') + '</div>' +
      '</div>' +
      adjLine +
      '</div>';
  }
  list.innerHTML = html;
}

function calcNDE() {
  var liab = parseFloat((g('liabilities-val') || {}).value) || 0;
  var totalGEV = 0, totalAdjusted = 0;
  for(var i = 0; i < assets.length; i++) {
    var a = assets[i];
    var disc = (DISCOUNT_MAP[a.mode] && DISCOUNT_MAP[a.mode][a.urgency]) || 0;
    totalGEV += a.appraised;
    totalAdjusted += a.appraised * (1 - disc);
  }
  return { liab: liab, totalGEV: totalGEV, totalAdjusted: totalAdjusted, nde: Math.max(0, totalAdjusted - liab) };
}

function calculateAssets() {
  if(assets.length === 0) {
    alert(lang === 'ar' ? 'يُرجى إضافة أصل واحد على الأقل' : lang === 'ms' ? 'Sila tambah sekurang-kurangnya satu aset' : 'Please add at least one asset.');
    return;
  }
  var ned = calcNDE();
  if(ned.nde <= 0) {
    alert(lang === 'ar' ? 'صافي التركة صفر أو سالب بعد الخصومات.' : lang === 'ms' ? 'NDE adalah sifar atau negatif selepas potongan.' : 'Net Distributable Estate is zero or negative after deductions.');
    return;
  }
  lastEstate = ned.nde;
  lastResult = track === 'syariah' ? calcFaraid(ned.nde) : calcCivil(ned.nde);
  renderIlliquidResults(ned.totalGEV, ned.totalAdjusted, ned.liab, ned.nde, lastResult);
}

function renderIlliquidResults(gev, adjGev, liab, nde, heirResult) {
  g('empty-state').style.display = 'none';
  var wrap = g('results-wrap');
  wrap.style.display = 'flex';

  var tl = ASSET_TYPE_LABELS[lang] || ASSET_TYPE_LABELS.en;
  var ml = MODE_LABELS[lang] || MODE_LABELS.en;
  var ul = URGENCY_LABELS[lang] || URGENCY_LABELS.en;
  var segColors = ['2a5c45','b8962e','8b3a2a','3a7a5e','a84a38','1a4c35','d4af5a'];

  // Asset ledger rows
  var assetRows = '';
  var gevBar = '';
  for(var i = 0; i < assets.length; i++) {
    var a = assets[i];
    var disc = (DISCOUNT_MAP[a.mode] && DISCOUNT_MAP[a.mode][a.urgency]) || 0;
    var adjVal = a.appraised * (1 - disc);
    var flex = adjGev > 0 ? Math.round(adjVal / adjGev * 1000) : 0;
    assetRows += '<tr>' +
      '<td><strong>' + a.name + '</strong><br><span class="asset-type-pill ' + a.type + '">' + (tl[a.type] || a.type) + '</span></td>' +
      '<td>' + fmt(a.appraised) + '</td>' +
      '<td><span class="mode-pill ' + a.mode + '">' + a.mode + ': ' + (ml[a.mode] || '') + '</span><br><span style="font-family:\'DM Mono\',monospace;font-size:0.55rem;color:rgba(13,13,13,0.35);">' + (ul[a.urgency] || '') + '</span></td>' +
      '<td>' + (disc > 0 ? '<span class="discount-note">−' + (disc*100).toFixed(0) + '%</span>' : '—') + '</td>' +
      '<td>' + fmt(adjVal) + '</td>' +
      '</tr>';
    gevBar += '<div class="gev-seg" style="flex:' + flex + ';background:#' + segColors[i % segColors.length] + ';" title="' + a.name + ': ' + fmt(adjVal) + '">' + (flex > 80 ? a.name.slice(0,5) : '') + '</div>';
  }

  // Heir entitlement rows
  var entRows = '';
  for(var hi = 0; hi < heirResult.rows.length; hi++) {
    var r = heirResult.rows[hi];
    var breakdown = '';
    for(var ai = 0; ai < assets.length; ai++) {
      var aa = assets[ai];
      var ddisc = (DISCOUNT_MAP[aa.mode] && DISCOUNT_MAP[aa.mode][aa.urgency]) || 0;
      var aVal = aa.appraised * (1 - ddisc);
      var hShare = aVal * r.shareVal;
      if(hShare > 0.01) {
        if(breakdown) breakdown += ' · ';
        breakdown += aa.name + ' (' + aa.mode + ') → ' + fmt(hShare);
      }
    }
    entRows += '<div class="entitlement-row' + (r.shareVal > 0 ? ' active-card' : '') + '">' +
      '<div style="display:grid;grid-template-columns:1fr auto;align-items:start;gap:0.5rem;">' +
      '<div>' +
      '<div class="entitlement-heir">' + r.label + (r.count > 1 ? ' ×' + r.count : '') + '</div>' +
      '<div class="entitlement-frac">' + r.fracStr + ' — ' + (r.shareVal*100).toFixed(2) + '%</div>' +
      '<div class="entitlement-breakdown" style="margin-top:0.3rem;">' + (breakdown || '—') + '</div>' +
      '</div>' +
      '<div style="text-align:right;">' +
      '<div class="entitlement-total">' + fmt(r.totalAmount) + '</div>' +
      (r.count > 1 ? '<div style="font-family:\'DM Mono\',monospace;font-size:0.58rem;color:rgba(13,13,13,0.35);">' + fmt(r.perPerson) + ' ' + t('result.each') + '</div>' : '') +
      '<div class="entitlement-sbt">SBT</div>' +
      '</div></div></div>';
  }

  var lbl = lang === 'ar', lms = lang === 'ms';
  var trackBadge = heirResult.track === 'syariah' ? t('result.syariah.badge') : t('result.civil.badge');
  var trackColor = heirResult.track === 'syariah' ? 'jade' : 'rust';

  var blockedHTML = (heirResult.blocked && heirResult.blocked.length > 0)
    ? '<div class="info-box"><p><strong>' + t('blocked.title') + '</strong> ' + t('blocked.note') + ' <em>' + heirResult.blocked.join('; ') + '</em>.</p><div class="rule-cite">' + t('blocked.rule') + '</div></div>'
    : '';
  var warningsHTML = heirResult.warnings.map(function(w){ return '<div class="info-box warn"><p>' + w + '</p></div>'; }).join('');

  wrap.innerHTML =
    '<div class="result-header">' +
      '<div>' +
        '<span class="result-track-badge ' + trackColor + '">' + trackBadge + '</span>' +
        '<div style="font-family:\'DM Mono\',monospace;font-size:0.58rem;letter-spacing:0.1em;text-transform:uppercase;color:rgba(13,13,13,0.35);margin-top:0.5rem;">' + (lbl ? 'تقييم الأصول' : lms ? 'Penilaian Aset' : 'Asset Ledger Mode') + '</div>' +
      '</div>' +
      '<div class="result-timestamp">' + new Date().toLocaleDateString('en-MY',{day:'2-digit',month:'short',year:'numeric'}) + '<br><span style="color:var(--gold);font-size:0.55rem;">' + t('result.indicative') + '</span></div>' +
    '</div>' +

    '<div>' +
      '<div class="dist-section-title">' + (lbl ? 'سجل الأصول' : lms ? 'Senarai Aset' : 'Asset Ledger') + '</div>' +
      '<div class="gev-bar">' + gevBar + '</div>' +
      '<table class="asset-ledger"><thead><tr>' +
        '<th>' + (lbl ? 'الأصل' : lms ? 'Aset' : 'Asset') + '</th>' +
        '<th>' + (lbl ? 'القيمة المقدّرة' : lms ? 'Nilai Taksiran' : 'Appraised') + '</th>' +
        '<th>' + (lbl ? 'وضع الحل' : lms ? 'Mod' : 'Mode') + '</th>' +
        '<th>' + (lbl ? 'الخصم' : lms ? 'Diskaun' : 'Discount') + '</th>' +
        '<th>' + (lbl ? 'القيمة المعدّلة' : lms ? 'Nilai Terlaras' : 'Adjusted') + '</th>' +
      '</tr></thead><tbody>' + assetRows + '</tbody></table>' +
    '</div>' +

    '<div class="summary-equation">' +
      '<div class="eq-line"><span class="eq-label">' + (lbl ? 'إجمالي قيمة التركة (GEV)' : lms ? 'Jumlah Nilai Kasar (GEV)' : 'Gross Estate Value (GEV)') + '</span>  <span class="eq-val">' + fmt(gev) + '</span></div>' +
      '<div class="eq-line"><span class="eq-label">' + (lbl ? 'بعد خصم السيولة' : lms ? 'Selepas Diskaun Kecairan' : 'After Liquidity Discounts') + '</span>  <span class="eq-val">' + fmt(adjGev) + '</span></div>' +
      '<div class="eq-line"><span class="eq-label">− ' + (lbl ? 'الديون + مصاريف الجنازة' : lms ? 'Hutang + Kos' : 'Debts + Funeral + Admin') + '</span>  <span class="eq-val" style="color:var(--rust);">' + fmt(liab) + '</span></div>' +
      '<div style="border-top:1px solid rgba(184,150,46,0.2);margin:0.5rem 0;"></div>' +
      '<div class="eq-line"><span class="eq-label">' + (lbl ? 'صافي التركة القابل للتوزيع (NDE)' : lms ? 'Harta Bersih Boleh Agih (NDE)' : 'Net Distributable Estate (NDE)') + '</span></div>' +
      '<div class="eq-result">' + fmtShort(nde) + '</div>' +
    '</div>' +

    '<div class="entitlement-section">' +
      '<div class="dist-section-title">' + (lbl ? 'استحقاقات الورثة' : lms ? 'Hak Waris' : 'Heir Entitlements') + '</div>' +
      entRows +
    '</div>' +

    blockedHTML + warningsHTML +

    '<div class="info-box"><p><strong>' + t('disclaimer.title') + '</strong> ' + t('disclaimer.text') + '</p>' +
    '<div class="rule-cite">' + (heirResult.track === 'syariah' ? t('disclaimer.rule.syariah') : t('disclaimer.rule.civil')) + '</div></div>';
}

// ── PATCHED: calculate delegates to asset engine when in asset panel ──
var _origCalculate = calculate;
calculate = function() {
  if(activePanel === 'assets') { calculateAssets(); return; }
  _origCalculate();
};

// ── PATCHED: resetAll clears assets too ──
var _origReset = resetAll;
resetAll = function() {
  _origReset();
  assets = [];
  assetIdCounter = 0;
  var al = g('asset-list');
  if(al) al.innerHTML = '';
  var lv = g('liabilities-val');
  if(lv) lv.value = '';
};

// ── PATCHED: setLang re-renders asset list if active ──
var _origSetLang = setLang;
setLang = function(l) {
  _origSetLang(l);
  if(activePanel === 'assets') renderAssetList();
};

// ── INIT ──
setLang('en');
setTrack('syariah');
</script>
</body>
</html>
